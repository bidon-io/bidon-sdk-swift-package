name: Auto Approve Specs Bot PRs

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'bidon-runner' &&
      startsWith(github.event.pull_request.head.ref, 'bot/spm-')
    steps:
      - name: Approve and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --approve
          gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --squash --delete-branch
