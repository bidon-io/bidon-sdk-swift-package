name: Auto Approve Specs Bot PRs

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'bidon-runner' &&
      startsWith(github.event.pull_request.head.ref, 'bot/spm-')
    steps:
      - name: Approve and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --approve
          gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --squash --delete-branch

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.pull_request.head.ref }}"
          VERSION="${VERSION#bot/spm-}"
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from branch name"
            exit 1
          fi
          echo "Creating tag: $VERSION"
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$VERSION" \
            -f sha="$(gh pr view ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --json mergeCommit -q '.mergeCommit.oid')"
