name: Auto Approve Specs Bot PRs

on:
  workflow_run:
    workflows: ["Check PR"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'bidon-runner' &&
      startsWith(github.event.workflow_run.head_branch, 'bot/spm-')
    steps:
      - name: Find PR number
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --json number --jq '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Approve and Merge
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ steps.find-pr.outputs.pr_number }} --repo "${{ github.repository }}" --approve
          gh pr merge ${{ steps.find-pr.outputs.pr_number }} --repo "${{ github.repository }}" --squash --delete-branch
