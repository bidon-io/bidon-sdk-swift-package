name: Tag SPM Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Package.swift was changed
        id: changed
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep -c '^Package.swift$' || true)
          echo "package_changed=$CHANGED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and create tag
        if: steps.changed.outputs.package_changed != '0'
        run: |
          VERSION=$(grep -oP 'bidon-ios/SPM/Bidon/\K[^/]+(?=/Bidon\.xcframework\.zip)' Package.swift | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from Package.swift"
            exit 1
          fi
          TAG="$VERSION"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"
